name: CI

on:
  push:
  pull_request:

jobs:
  # Fast check: the DSP library and its unit tests, without JUCE, on all three platforms
  dsp-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DHARDTUNE_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Full plugin build (VST3 + Standalone, plus AU on macOS)
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DHARDTUNE_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: HardTune-${{ matrix.os }}
          path: build/plugin/HardTune_artefacts/Release/
